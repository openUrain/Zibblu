<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 184" width="1200" height="184" role="img" aria-labelledby="cap-zh-title">
  <title id="cap-zh-title">Zibblu 核心能力：日常聊天、可靠文件分享、局域网私密聊天、只读 AI 助手</title>
  <defs>
    <linearGradient id="cbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171226"/>
      <stop offset="100%" stop-color="#241b3d"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#c4a7ff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="184" rx="20" fill="url(#cbg)" stroke="#c4a7ff" stroke-opacity="0.22" stroke-width="1.2"/>

  <!-- Card 1 -->
  <g transform="translate(20, 20)">
    <rect width="278" height="144" rx="16" fill="url(#card)" stroke="#dfd0ff" stroke-opacity="0.18"/>
    <line x1="16" y1="1" x2="262" y2="1" stroke="url(#rim)"/>
    <rect x="20" y="20" width="40" height="40" rx="11" fill="#7c56d6" fill-opacity="0.30" stroke="#dfd0ff" stroke-opacity="0.32"/>
    <g transform="translate(28, 28)" fill="none" stroke="#f0e8ff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 11.5c0 4.14-3.58 7.5-8 7.5-1.15 0-2.25-.22-3.24-.63L4 20l1.16-3.48A7.22 7.22 0 0 1 4 11.5C4 7.36 7.58 4 12 4s8 3.36 8 7.5Z" fill="#c4a7ff" fill-opacity="0.2"/>
      <path d="M8.5 11.5h7M8.5 14.5h4.2"/>
    </g>
    <text x="20" y="88" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#ffffff">日常聊天</text>
    <text x="20" y="110" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12.5" fill="#cbc3dc">私聊与群聊，收到消息保存</text>
    <text x="20" y="128" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12.5" fill="#cbc3dc">于本机 SQLite 离线可读。</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(314, 20)">
    <rect width="278" height="144" rx="16" fill="url(#card)" stroke="#dfd0ff" stroke-opacity="0.18"/>
    <line x1="16" y1="1" x2="262" y2="1" stroke="url(#rim)"/>
    <rect x="20" y="20" width="40" height="40" rx="11" fill="#7c56d6" fill-opacity="0.30" stroke="#dfd0ff" stroke-opacity="0.32"/>
    <g transform="translate(28, 28)" fill="none" stroke="#f0e8ff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 7.5a2 2 0 0 1 2-2h4.2l1.8 2.2h7a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-10Z" fill="#c4a7ff" fill-opacity="0.2"/>
      <path d="M12 11.5v5m-2.5-2.5L12 16.5l2.5-2.5"/>
    </g>
    <text x="20" y="88" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#ffffff">可靠文件分享</text>
    <text x="20" y="110" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12.5" fill="#cbc3dc">发送文件与文件夹，支持断</text>
    <text x="20" y="128" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12.5" fill="#cbc3dc">点续传及 SHA-256 校验。</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(608, 20)">
    <rect width="278" height="144" rx="16" fill="url(#card)" stroke="#dfd0ff" stroke-opacity="0.18"/>
    <line x1="16" y1="1" x2="262" y2="1" stroke="url(#rim)"/>
    <rect x="20" y="20" width="40" height="40" rx="11" fill="#7c56d6" fill-opacity="0.30" stroke="#dfd0ff" stroke-opacity="0.32"/>
    <g transform="translate(28, 28)" fill="none" stroke="#f0e8ff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="10.5" width="14" height="9.5" rx="2.5" fill="#c4a7ff" fill-opacity="0.2"/>
      <path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3M12 14.2v2.4"/>
    </g>
    <text x="20" y="88" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#ffffff">局域网私密空间</text>
    <text x="20" y="110" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12.5" fill="#cbc3dc">双方同意后局域网加密直连，</text>
    <text x="20" y="128" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12.5" fill="#cbc3dc">无公网中转与隐式回退。</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(902, 20)">
    <rect width="278" height="144" rx="16" fill="url(#card)" stroke="#dfd0ff" stroke-opacity="0.18"/>
    <line x1="16" y1="1" x2="262" y2="1" stroke="url(#rim)"/>
    <rect x="20" y="20" width="40" height="40" rx="11" fill="#7c56d6" fill-opacity="0.30" stroke="#dfd0ff" stroke-opacity="0.32"/>
    <g transform="translate(28, 28)" fill="none" stroke="#f0e8ff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.5 14.4 9.6 20.5 12l-6.1 2.4L12 20.5l-2.4-6.1L3.5 12l6.1-2.4L12 3.5Z" fill="#c4a7ff" fill-opacity="0.2"/>
      <circle cx="18.5" cy="5.5" r="1.25"/>
    </g>
    <text x="20" y="88" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#ffffff">只读 AI 助手</text>
    <text x="20" y="110" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12.5" fill="#cbc3dc">逐次手动授权消息与文件，</text>
    <text x="20" y="128" font-family="system-ui, -apple-system, 'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="12.5" fill="#cbc3dc">绝不接触局域网私密内容。</text>
  </g>
</svg>
