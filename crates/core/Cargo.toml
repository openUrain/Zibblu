[package]
name = "zibblu-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
client = [
  "dep:anyhow", "dep:reqwest", "dep:serde_json", "dep:sha2", "dep:sqlx",
  "dep:tempfile", "dep:thiserror", "dep:tokio", "dep:walkdir", "dep:zip",
]

[dependencies]
anyhow = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sqlx = { workspace = true, features = ["sqlite"], optional = true }
tempfile = { version = "3", optional = true }
thiserror = { version = "2", optional = true }
tokio = { workspace = true, features = ["fs", "io-util"], optional = true }
uuid.workspace = true
walkdir = { version = "2", optional = true }
zip = { version = "4.6", default-features = false, optional = true }
