
name: Zibblu CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-integration:
    name: Rust + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zibblu
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: zibblu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zibblu -d zibblu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test real messaging and file transfer
        env:
          ZIBBLU_TEST_DATABASE_URL: postgres://zibblu:ci_test_password@localhost:5432/zibblu_test
        run: cargo test --locked -p zibblu-online --test m1

  desktop-rust:
    name: Tauri Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Build frontend assets
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check desktop Rust
        run: cargo check --locked -p zibblu-desktop --features custom-protocol

  frontend:
    name: React + TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
