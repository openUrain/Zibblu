[package]
name = "zibblu-online"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["postgres", "uuid", "json", "migrate", "macros", "tls-rustls-ring-native-roots"] }
tokio = { workspace = true, features = ["net", "signal"] }
uuid.workspace = true
zibblu-core.workspace = true

[dev-dependencies]
reqwest = { version = "0.12", default-features = false }
tempfile = "3"
zibblu-core = { workspace = true, features = ["client"] }
